<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Defender Arcade - 1v1 & Story Mode</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0a0a1a 0%, #020205 100%);
        }
        /* UI Overlay Elements */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            z-index: 10;
        }
        .interactive {
            pointer-events: auto;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(10, 10, 25, 0.7);
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hud-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 14px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 8, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-card {
            background: linear-gradient(145deg, #12122c, #0d0d1f);
            border: 2px solid rgba(99, 102, 241, 0.3);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }
        .modal-card h1 {
            margin-top: 0;
            color: #818cf8;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .modal-card p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* Virtual Joysticks & Controls */
        .joystick-base {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 5;
        }
        .joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.6);
            border: 2px solid #818cf8;
            transform: translate(-50%, -50%);
        }
        .fire-btn-hud {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.7) 0%, rgba(185, 28, 28, 0.8) 100%);
            border: 3px solid rgba(255, 255, 255, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            font-size: 14px;
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.5);
            z-index: 5;
            pointer-events: auto;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Canvas principal del juego -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay para HUD e Interacciones -->
    <div class="ui-layer">
        <div class="hud-top interactive" id="hudTop">
            <div class="hud-group">
                <span id="hudScore" style="font-weight: bold; font-size: 16px;">PUNTOS: 0</span>
                <span id="hudGems" style="color: #38bdf8; font-weight: bold; font-size: 16px;">💎: 0</span>
                <span id="hudLevel" style="color: #a855f7; font-weight: bold; font-size: 16px;">NIVEL: 1</span>
            </div>
            <div class="hud-group">
                <button class="btn" id="btnPause">Pausar</button>
                <button class="btn btn-danger" id="btnQuit" style="display:none;">Salir</button>
            </div>
        </div>
        <div style="flex-grow: 1;"></div>
    </div>

    <!-- Controles Táctiles / Joysticks -->
    <div id="joystickP1" class="joystick-base"><div class="joystick-stick"></div></div>
    <div id="fireBtnP1" class="fire-btn-hud">FUEGO</div>
    <div id="joystickP2" class="joystick-base"><div class="joystick-stick"></div></div>
    <div id="fireBtnP2" class="fire-btn-hud" style="background: radial-gradient(circle, rgba(139, 92, 246, 0.7) 0%, rgba(109, 40, 217, 0.8) 100%);">P2 FUEGO</div>

    <!-- Modal Inicial: Selección de Dispositivo -->
    <div id="modalDevice" class="modal-overlay">
        <div class="modal-card">
            <h1>SPACE DEFENDER</h1>
            <p>Selecciona tu dispositivo para configurar los controles y la interfaz visual óptima.</p>
            <div class="modal-buttons">
                <button class="btn" id="devPC">🖥️ PC / Laptop (Teclado)</button>
                <button class="btn btn-success" id="devMobile">📱 Móvil / Tablet (Táctil)</button>
            </div>
        </div>
    </div>

    <!-- Modal Menú Principal -->
    <div id="modalMenu" class="modal-overlay hidden">
        <div class="modal-card">
            <h1>MENÚ PRINCIPAL</h1>
            <p>Elige el modo de juego y prepárate para la batalla espacial.</p>
            <div class="modal-buttons">
                <button class="btn" id="menuStory">🚀 Modo Historia (1 Jugador)</button>
                <button class="btn btn-success" id="menuCoop">🤝 Modo Co-op (2 Jugadores)</button>
                <button class="btn btn-danger" id="menuPvP">⚔️ Modo PvP War (1v1 Puro)</button>
                <button class="btn" id="menuShop" style="background: linear-gradient(135deg, #d97706, #b45309);">💎 Tienda de Mejoras</button>
                <button class="btn" id="downloadGameBtn" style="background: linear-gradient(135deg, #06b6d4, #0891b2); margin-top: 10px;">💾 Descargar index.html</button>
            </div>
        </div>
    </div>

    <!-- Modal Tienda -->
    <div id="modalShop" class="modal-overlay hidden">
        <div class="modal-card">
            <h1>TIENDA ESPACIAL</h1>
            <p>Mejora tus naves usando gemas recolectadas en batalla.</p>
            <div id="shopContent" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; text-align: left;">
                <!-- Opciones de tienda dinámicas -->
            </div>
            <button class="btn" id="closeShop">Volver al Menú</button>
        </div>
    </div>

    <script>
        // --- MOTOR PRINCIPAL Y AUDIO API ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Web Audio API para efectos de sonido sintéticos
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'gem') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        // --- ESTADOS Y DATOS PERSISTENTES ---
        let saveData = JSON.parse(localStorage.getItem('space_defender_save')) || {
            gems: 50,
            deviceType: null, // 'pc' o 'phone'
            upgrades: { speed: 0, damage: 0, fireRate: 0 }
        };

        function saveGame() {
            localStorage.setItem('space_defender_save', JSON.stringify(saveData));
        }

        let gameState = 'DEVICE_SELECT'; // DEVICE_SELECT, MENU, PLAYING, SHOP, PAUSED, GAMEOVER
        let gameMode = 'story'; // story, coop, pvp
        let currentLevel = 1;
        let score = 0;
        let keys = {};

        // --- JUGADORES Y ENTIDADES ---
        let player1, player2;
        let bullets = [];
        let enemies = [];
        let asteroids = [];
        let particles = [];
        let gemsList = [];
        let boss = null;
        let enemyAI = null;

        class Player {
            constructor(x, y, isP2 = false) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.angle = isP2 ? Math.PI : 0;
                this.vx = 0;
                this.vy = 0;
                this.speed = 4 + (saveData.upgrades.speed * 0.5);
                this.maxHealth = 3;
                this.health = 3;
                this.isP2 = isP2;
                this.invulnerableUntil = 0;
                this.lastShot = 0;
                this.cooldown = Math.max(100, 300 - (saveData.upgrades.fireRate * 40));
            }

            update(targetX, targetY, isMoving, isFiring) {
                if (gameMode === 'pvp') {
                    // PvP Carat a cara estricto sin inercia compleja
                    if (isMoving) {
                        const dx = targetX - this.x;
                        const dy = targetY - this.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 5) {
                            this.x += (dx / dist) * this.speed;
                            this.y += (dy / dist) * this.speed;
                            this.angle = Math.atan2(dy, dx);
                        }
                    }
                } else {
                    // Movimiento estándar de naves
                    if (isMoving) {
                        const dx = targetX - this.x;
                        const dy = targetY - this.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 5) {
                            this.x += (dx / dist) * this.speed;
                            this.y += (dy / dist) * this.speed;
                            this.angle = Math.atan2(dy, dx);
                        }
                    }
                }

                // Limites de pantalla según modo y pantalla dividida
                if (gameMode === 'coop' || gameMode === 'pvp') {
                    const isMobilePhone = saveData.deviceType === 'phone';
                    if (isMobilePhone) {
                        // División horizontal
                        const halfH = height / 2;
                        if (!this.isP2) {
                            this.y = Math.max(this.radius, Math.min(halfH - 10, this.y));
                        } else {
                            this.y = Math.max(halfH + 10, Math.min(height - this.radius, this.y));
                        }
                        this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                    } else {
                        // División vertical
                        const halfW = width / 2;
                        if (!this.isP2) {
                            this.x = Math.max(this.radius, Math.min(halfW - 10, this.x));
                        } else {
                            this.x = Math.max(halfW + 10, Math.min(width - this.radius, this.x));
                        }
                        this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));
                    }
                } else {
                    this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));
                }

                if (isFiring && Date.now() - this.lastShot > this.cooldown) {
                    this.shoot();
                    this.lastShot = Date.now();
                }
            }

            shoot() {
                playSound('laser');
                const bSpeed = 10;
                bullets.push({
                    x: this.x + Math.cos(this.angle) * 25,
                    y: this.y + Math.sin(this.angle) * 25,
                    vx: Math.cos(this.angle) * bSpeed,
                    vy: Math.sin(this.angle) * bSpeed,
                    isP2: this.isP2,
                    damage: 1 + saveData.upgrades.damage
                });
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle + Math.PI / 2);

                // Efecto de parpadeo estricto por inmunidad
                if (Date.now() < this.invulnerableUntil && Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.globalAlpha = 0.4;
                }

                // Dibujo de nave
                ctx.fillStyle = this.isP2 ? '#a855f7' : '#38bdf8';
                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.lineTo(this.radius * 0.8, this.radius);
                ctx.lineTo(0, this.radius * 0.6);
                ctx.lineTo(-this.radius * 0.8, this.radius);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            hit() {
                if (Date.now() < this.invulnerableUntil) return;
                this.health--;
                this.invulnerableUntil = Date.now() + 1500; // 1.5s de inmunidad absoluta sin bucle
                playSound('explosion');
                if (this.health <= 0) {
                    gameOver(this.isP2 ? "¡JUGADOR 1 GANA!" : (gameMode === 'pvp' ? "¡JUGADOR 2 GANA!" : "¡PARTIDA TERMINADA!"));
                }
            }
        }

        // --- NAVE ENEMIGA CON IA (MODO HISTORIA NIVEL FINAL) ---
        class EnemyShipAI {
            constructor() {
                this.x = width / 2;
                this.y = 150;
                this.radius = 35;
                this.health = 50;
                this.maxHealth = 50;
                this.speed = 3;
                this.angle = 0;
                this.lastShot = 0;
                this.state = 'ATTACK';
            }

            update() {
                if (!player1) return;
                const dx = player1.x - this.x;
                const dy = player1.y - this.y;
                const dist = Math.hypot(dx, dy);

                this.angle = Math.atan2(dy, dx);

                // IA: Movimiento táctico y esquiva
                if (dist > 200) {
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;
                } else {
                    this.x -= Math.sin(Date.now() * 0.003) * 4;
                }

                // Disparo de IA
                if (Date.now() - this.lastShot > 1000) {
                    playSound('laser');
                    bullets.push({
                        x: this.x,
                        y: this.y,
                        vx: Math.cos(this.angle) * 7,
                        vy: Math.sin(this.angle) * 7,
                        isEnemy: true,
                        damage: 1
                    });
                    this.lastShot = Date.now();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle + Math.PI / 2);

                // Nave nodriza / caza con IA
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.lineTo(this.radius, this.radius);
                ctx.lineTo(0, this.radius * 0.5);
                ctx.lineTo(-this.radius, this.radius);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#f87171';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.restore();

                // Barra de vida del jefe IA
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(width / 2 - 100, 40, 200, 10);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(width / 2 - 100, 40, (this.health / this.maxHealth) * 200, 10);
            }

            hit(dmg) {
                this.health -= dmg;
                playSound('explosion');
                if (this.health <= 0) {
                    score += 1000;
                    saveData.gems += 20;
                    saveGame();
                    victory();
                }
            }
        }

        // --- INICIALIZACIÓN Y GESTIÓN DE JUEGO ---
        function startGame(mode) {
            gameMode = mode;
            score = 0;
            currentLevel = 1;
            bullets = [];
            enemies = [];
            asteroids = [];
            particles = [];
            gemsList = [];
            boss = null;
            enemyAI = null;

            if (mode === 'story') {
                player1 = new Player(width / 2, height - 100, false);
                player2 = null;
                spawnAsteroids(5);
            } else if (mode === 'coop') {
                player1 = new Player(width / 3, height - 100, false);
                player2 = new Player((width / 3) * 2, height - 100, true);
                spawnAsteroids(6);
            } else if (mode === 'pvp') {
                // Modo PvP 1v1 puro sin meteoritos
                player1 = new Player(width / 2, height - 150, false);
                player2 = new Player(width / 2, 150, true);
                player2.angle = 0; // Frente a frente
            }

            document.getElementById('modalMenu').classList.add('hidden');
            document.getElementById('btnQuit').style.display = 'inline-block';
            gameState = 'PLAYING';
            setupControlsUI();
        }

        function spawnAsteroids(count) {
            if (gameMode === 'pvp') return; // Sin meteoritos en PvP
            asteroids = [];
            for (let i = 0; i < count; i++) {
                asteroids.push({
                    x: Math.random() * width,
                    y: Math.random() * (height / 2),
                    radius: 25 + Math.random() * 20,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    health: 2
                });
            }
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel > 3) {
                victory();
                return;
            }
            if (currentLevel === 3) {
                enemyAI = new EnemyShipAI();
            } else {
                spawnAsteroids(4 + currentLevel * 2);
            }
        }

        function gameOver(msg) {
            gameState = 'GAMEOVER';
            alert(msg);
            location.reload();
        }

        function victory() {
            gameState = 'GAMEOVER';
            alert("¡VICTORIA ÉPICA COMPLETADA!");
            location.reload();
        }

        // --- CONTROLES Y TACTIL ---
        let touchData = { p1TouchId: null, p1StartX: 0, p1StartY: 0, p2TouchId: null, p2StartX: 0, p2StartY: 0 };

        function setupControlsUI() {
            const isMobile = saveData.deviceType === 'phone';
            const joyP1 = document.getElementById('joystickP1');
            const fireP1 = document.getElementById('fireBtnP1');
            const joyP2 = document.getElementById('joystickP2');
            const fireP2 = document.getElementById('fireBtnP2');

            if (isMobile) {
                joyP1.style.display = 'block';
                fireP1.style.display = 'flex';
                joyP1.style.left = '100px';
                joyP1.style.bottom = '100px';
                fireP1.style.right = '40px';
                fireP1.style.bottom = '80px';

                if (gameMode === 'coop' || gameMode === 'pvp') {
                    joyP2.style.display = 'block';
                    fireP2.style.display = 'flex';
                    joyP2.style.right = '100px';
                    joyP2.style.top = '100px';
                    fireP2.style.left = '40px';
                    fireP2.style.top = '80px';
                }
            }
        }

        // Event Listeners UI Dispositivo
        document.getElementById('devPC').addEventListener('click', () => {
            saveData.deviceType = 'pc';
            saveGame();
            document.getElementById('modalDevice').classList.add('hidden');
            document.getElementById('modalMenu').classList.remove('hidden');
        });

        document.getElementById('devMobile').addEventListener('click', () => {
            saveData.deviceType = 'phone';
            saveGame();
            document.getElementById('modalDevice').classList.add('hidden');
            document.getElementById('modalMenu').classList.remove('hidden');
        });

        document.getElementById('menuStory').addEventListener('click', () => startGame('story'));
        document.getElementById('menuCoop').addEventListener('click', () => startGame('coop'));
        document.getElementById('menuPvP').addEventListener('click', () => startGame('pvp'));
        
        document.getElementById('menuShop').addEventListener('click', () => {
            document.getElementById('modalMenu').classList.add('hidden');
            document.getElementById('modalShop').classList.remove('hidden');
            renderShop();
        });

        document.getElementById('closeShop').addEventListener('click', () => {
            document.getElementById('modalShop').classList.add('hidden');
            document.getElementById('modalMenu').classList.remove('hidden');
        });

        document.getElementById('btnQuit').addEventListener('click', () => {
            location.reload();
        });

        // Botón de Descarga Directa integrado en menú
        document.getElementById('downloadGameBtn').addEventListener('click', () => {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        function renderShop() {
            const content = document.getElementById('shopContent');
            content.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Velocidad Nivel: ${saveData.upgrades.speed}</span>
                    <button class="btn" onclick="buyUpgrade('speed')">Mejorar (20 💎)</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Daño Nivel: ${saveData.upgrades.damage}</span>
                    <button class="btn" onclick="buyUpgrade('damage')">Mejorar (30 💎)</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Cadencia Nivel: ${saveData.upgrades.fireRate}</span>
                    <button class="btn" onclick="buyUpgrade('fireRate')">Mejorar (25 💎)</button>
                </div>
                <p style="margin-top:15px; color:#38bdf8;">Gemas disponibles: 💎 ${saveData.gems}</p>
            `;
        }

        window.buyUpgrade = function(type) {
            const cost = type === 'speed' ? 20 : (type === 'damage' ? 30 : 25);
            if (saveData.gems >= cost) {
                saveData.gems -= cost;
                saveData.upgrades[type]++;
                saveGame();
                renderShop();
            } else {
                alert("¡No tienes suficientes gemas!");
            }
        };

        // Controles de Teclado
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Controles Táctiles Pantalla
        window.addEventListener('touchstart', e => {
            for (let touch of e.changedTouches) {
                if (touch.clientX < width / 2 && touchData.p1TouchId === null && saveData.deviceType === 'phone') {
                    touchData.p1TouchId = touch.identifier;
                    touchData.p1StartX = touch.clientX;
                    touchData.p1StartY = touch.clientY;
                }
            }
        });

        window.addEventListener('touchmove', e => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === touchData.p1TouchId && player1) {
                    const dx = touch.clientX - touchData.p1StartX;
                    const dy = touch.clientY - touchData.p1StartY;
                    player1.x += dx * 0.1;
                    player1.y += dy * 0.1;
                    if (Math.hypot(dx, dy) > 2) {
                        player1.angle = Math.atan2(dy, dx);
                    }
                }
            }
        });

        window.addEventListener('touchend', e => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === touchData.p1TouchId) {
                    touchData.p1TouchId = null;
                }
            }
        });

        document.getElementById('fireBtnP1').addEventListener('touchstart', () => {
            if (player1) player1.shoot();
        });
        document.getElementById('fireBtnP2').addEventListener('touchstart', () => {
            if (player2) player2.shoot();
        });


        // --- BUCLE PRINCIPAL DE JUEGO ---
        function update() {
            if (gameState !== 'PLAYING') return;

            // Input P1 Teclado
            if (player1 && saveData.deviceType === 'pc') {
                let p1Moving = false;
                let tx = player1.x, ty = player1.y;
                if (keys['KeyW']) { ty -= player1.speed; p1Moving = true; player1.angle = -Math.PI/2; }
                if (keys['KeyS']) { ty += player1.speed; p1Moving = true; player1.angle = Math.PI/2; }
                if (keys['KeyA']) { tx -= player1.speed; p1Moving = true; player1.angle = Math.PI; }
                if (keys['KeyD']) { tx += player1.speed; p1Moving = true; player1.angle = 0; }
                player1.update(tx, ty, p1Moving, keys['Space']);
            } else if (player1) {
                player1.update(player1.x, player1.y, false, false);
            }

            // Input P2 Teclado (Co-op / PvP)
            if (player2 && gameMode !== 'story') {
                let p2Moving = false;
                let tx2 = player2.x, ty2 = player2.y;
                if (keys['ArrowUp']) { ty2 -= player2.speed; p2Moving = true; player2.angle = -Math.PI/2; }
                if (keys['ArrowDown']) { ty2 += player2.speed; p2Moving = true; player2.angle = Math.PI/2; }
                if (keys['ArrowLeft']) { tx2 -= player2.speed; p2Moving = true; player2.angle = Math.PI; }
                if (keys['ArrowRight']) { tx2 += player2.speed; p2Moving = true; player2.angle = 0; }
                player2.update(tx2, ty2, p2Moving, keys['Enter']);
            }

            // Actualizar IA Enemiga
            if (enemyAI) {
                enemyAI.update();
            }

            // Actualizar Balas
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Fuera de pantalla
                if (b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Colisiones balas P1 / P2
                if (gameMode === 'pvp') {
                    if (!b.isP2 && player2 && Math.hypot(b.x - player2.x, b.y - player2.y) < player2.radius) {
                        player2.hit();
                        bullets.splice(i, 1);
                        continue;
                    }
                    if (b.isP2 && player1 && Math.hypot(b.x - player1.x, b.y - player1.y) < player1.radius) {
                        player1.hit();
                        bullets.splice(i, 1);
                        continue;
                    }
                } else {
                    if (enemyAI && !b.isP2 && Math.hypot(b.x - enemyAI.x, b.y - enemyAI.y) < enemyAI.radius) {
                        enemyAI.hit(b.damage);
                        bullets.splice(i, 1);
                        continue;
                    }
                    if (b.isP2 && player1 && Math.hypot(b.x - player1.x, b.y - player1.y) < player1.radius) {
                        player1.hit();
                        bullets.splice(i, 1);
                        continue;
                    }
                }
            }

            // Actualizar asteroides
            for (let ast of asteroids) {
                ast.x += ast.vx;
                ast.y += ast.vy;
                if (ast.x < 0) ast.x = width;
                if (ast.x > width) ast.x = 0;
                if (ast.y < 0) ast.y = height;
                if (ast.y > height) ast.y = 0;

                if (player1 && Math.hypot(ast.x - player1.x, ast.y - player1.y) < ast.radius + player1.radius) {
                    player1.hit();
                }
                if (player2 && Math.hypot(ast.x - player2.x, ast.y - player2.y) < ast.radius + player2.radius) {
                    player2.hit();
                }
            }

            // HUD update
            document.getElementById('hudScore').innerText = `PUNTOS: ${score}`;
            document.getElementById('hudGems').innerText = `💎: ${saveData.gems}`;
            document.getElementById('hudLevel').innerText = `NIVEL: ${currentLevel}`;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Fondo estelar decorativo
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 50; i++) {
                ctx.fillRect((i * 137) % width, (i * 211 + Date.now() * 0.02) % height, 1.5, 1.5);
            }

            // Línea divisoria en PvP o Co-op
            if (gameMode === 'coop' || gameMode === 'pvp') {
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                if (saveData.deviceType === 'phone') {
                    ctx.moveTo(0, height / 2);
                    ctx.lineTo(width, height / 2);
                } else {
                    ctx.moveTo(width / 2, 0);
                    ctx.lineTo(width / 2, height);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Dibujar entidades
            if (player1) player1.draw();
            if (player2) player2.draw();
            if (enemyAI) enemyAI.draw();

            for (let ast of asteroids) {
                ctx.fillStyle = '#64748b';
                ctx.beginPath();
                ctx.arc(ast.x, ast.y, ast.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            for (let b of bullets) {
                ctx.fillStyle = b.isP2 ? '#a855f7' : (b.isEnemy ? '#ef4444' : '#38bdf8');
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
  </html>
